<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hello World Aesthetics</title>
  <style>
    body {
      text-align: center;
      font-family: 'Georgia', serif;
      padding-top: 100px;
      margin: 0;
      transition: background 1s ease, color 1s ease;
      position: relative;
      z-index: 0;
      min-height: 100vh;
      overflow-x: hidden;
      opacity: 1;
      background-size: 400% 400%;
      animation: gradientBG 6s ease infinite;
    }

    body.fade-out {
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    body.fade-in {
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body.pastel {
      background: linear-gradient(-45deg, #ffd1dc, #ffe8b6, #d0f4de, #c1e1ff, #e4c1f9, #fbc2eb, #fcd5ce);
      background-size: 400% 400%;
      animation: gradientBG 6s ease infinite;
      color: #333;
    }

    body.gothic {
      background: linear-gradient(-45deg, #0d0d0d, #1a1a1a, #2e2e2e, #4b0082, #3a3a3a, #5e005e, #000000);
      background-size: 400% 400%;
      animation: gradientBG 6s ease infinite;
      color: #e0e0e0;
    }

    body.minimalist {
      background: linear-gradient(-45deg, #ffffff, #f6f6f6, #eeeeee, #e0e0e0, #fafafa, #f2f2f2, #fefefe);
      background-size: 400% 400%;
      animation: gradientBG 6s ease infinite;
      color: #111;
    }

    body.dark-academia {
      background: linear-gradient(-45deg, #3e2f1c, #5a4a36, #8b6f47, #a68a64, #d1bfa7, #b59d83, #6e5849);
      background-size: 400% 400%;
      animation: gradientBG 6s ease infinite;
      color: #2b1e15;
    }

    h1 {
      font-size: 3em;
      animation: wave 2s ease-in-out infinite;
    }

    @keyframes wave {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    select, button {
      padding: 10px;
      font-size: 16px;
      margin: 10px;
      border-radius: 8px;
      border: none;
      transition: all 0.3s ease;
    }

    select:focus, button:hover {
      transform: scale(1.05);
    }

    #feedback {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1 id="message">Hello World! 🌍</h1>

  <select id="aestheticSelect">
    <option value="" disabled selected>Pick your aesthetic!</option>
    <option value="pastel">Pastel</option>
    <option value="gothic">Gothic</option>
    <option value="minimalist">Minimalist</option>
    <option value="dark-academia">Dark Academia</option>
  </select>
  <br>
  <button onclick= "showPopUp()" > ClickMe </button>
  <button onclick="applyAesthetic()">Submit</button>
  <button onclick="resetTheme()">Reset</button>

  <p id="feedback"></p>

  <script>
    function showPopUp() {
      const showPopUp = () => { alert(`Welcome!`); };
    }

    function applyAesthetic() {
      const aesthetic = document.getElementById("aestheticSelect").value;
      const message = document.getElementById("message");
      const feedback = document.getElementById("feedback");

      if (!aesthetic) {
        feedback.textContent = "Please choose an aesthetic!";
        return;
      }
      
      document.body.classList.remove("fade-in");
      document.body.classList.add("fade-out");

      setTimeout(() => {
        document.body.className = aesthetic + " fade-in";

        const title = aesthetic.replace("-", " ");
        message.textContent = `Hello ${toTitleCase(title)} World!`;
        feedback.textContent = `You've entered ${toTitleCase(title)} mode ✨`;
      }, 400);
    }

    function resetTheme() {
      document.body.className = '';
      document.body.style.background = "";
      document.body.style.color = "black";
      document.getElementById("message").textContent = "Hello World! 🌍";
      document.getElementById("feedback").textContent = "";
      document.getElementById("aestheticSelect").selectedIndex = 0;
    }

    function toTitleCase(str) {
      return str.split(" ").map(word => word[0].toUpperCase() + word.slice(1)).join(" ");
    }
  </script>
</body>
</html>
