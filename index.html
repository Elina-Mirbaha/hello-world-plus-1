<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hello World Plus One</title>
  <style>
    body {
      text-align: center;
      font-family: sans-serif;
      padding-top: 100px;
      transition: background 1s ease, color 1s ease;
    }
    select, button {
      padding: 10px;
      font-size: 16px;
      margin: 10px;
      border-radius: 8px;
      border: none;
    }
    #feedback {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1 id="message">Hello World! 🌍</h1>

  <p>Pick your favorite color theme:</p>
  <select id="colorSelect">
    <option value="blue">Blue</option>
    <option value="pink">Pink</option>
    <option value="green">Green</option>
    <option value="purple">Purple</option>
    <option value="yellow">Yellow</option>
    <option value="orange">Orange</option>
    <option value="red">Red</option>
    <option value="rainbow">Rainbow 🌈</option>
  </select>
  <br>
  <button onclick="changeTheme()">Submit</button>
  <button onclick="resetTheme()">Reset</button>

  <p id="feedback"></p>

  <script>
    function changeTheme() {
      const color = document.getElementById("colorSelect").value;
      const feedback = document.getElementById("feedback");
      const message = document.getElementById("message");

      const colorMap = {
        blue: ["#d0e8ff", "#003366"],
        pink: ["#ffe0ef", "#a0005b"],
        green: ["#dafbe1", "#174e26"],
        purple: ["#f0e6ff", "#4b0082"],
        yellow: ["#fff9d6", "#8a7200"],
        orange: ["#ffe8cc", "#b34700"],
        red: ["#ffd6d6", "#8b0000"]
      };

      if (color === "rainbow") {
        document.body.style.background = "linear-gradient(135deg, red, orange, yellow, green, blue, indigo, violet)";
        document.body.style.backgroundSize = "100% 100%";
        document.body.style.backgroundRepeat = "no-repeat";
        document.body.style.color = "#111";
        feedback.textContent = "🌈 Rainbow mode activated! Taste the colors.";
        return;
      }

      const [bg, text] = colorMap[color];
      document.body.style.background = bg;
      document.body.style.color = text;
      feedback.textContent = `Nice! The page is now themed with ${color}.`;
    }

    function resetTheme() {
      document.body.style.background = "white";
      document.body.style.color = "black";
      document.getElementById("feedback").textContent = "";
      document.getElementById("colorSelect").selectedIndex = 0;
    }
  </script>
</body>
</html>
