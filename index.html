<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hello World Aesthetics</title>
  <style>
    body {
      text-align: center;
      font-family: 'Georgia', serif;
      padding-top: 100px;
      margin: 0;
      transition: background 1s ease, color 1s ease;
      position: relative;
      z-index: 0;
      min-height: 100vh;
      overflow-x: hidden;
      opacity: 1;
    }

    body.fade-out {
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    body.fade-in {
      opacity: 1;
      transition: opacity 0.6s ease;
    }

    .aesthetic::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background-size: 400% 400%;
      animation: shimmer 15s ease infinite;
      z-index: -1;
    }

    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body.pastel.aesthetic::before {
      background: linear-gradient(270deg, #ffd1dc, #ffe8b6, #d0f4de, #c1e1ff, #d6c8f0, #f5c0e7);
    }

    body.gothic.aesthetic::before {
      background: linear-gradient(270deg, #1a1a1a, #2e2e2e, #4b0082, #3a3a3a, #000000);
    }

    body.minimalist.aesthetic::before {
      background: linear-gradient(270deg, #ffffff, #f6f6f6, #eeeeee, #fafafa, #fefefe);
    }

    body.dark-academia.aesthetic::before {
      background: linear-gradient(270deg, #3e2f1c, #5a4a36, #8b6f47, #d1bfa7, #b59d83);
    }

    h1 {
      font-size: 3em;
      animation: wave 2s ease-in-out infinite;
    }

    @keyframes wave {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    select, button {
      padding: 10px;
      font-size: 16px;
      margin: 10px;
      border-radius: 8px;
      border: none;
      transition: all 0.3s ease;
    }

    select:focus, button:hover {
      transform: scale(1.05);
    }

    #feedback {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    .audio-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      font-size: 14px;
      background: #eee;
      border-radius: 8px;
      padding: 5px 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1 id="message">Hello World! 🌍</h1>

  <select id="aestheticSelect">
    <option value="" disabled selected>Pick your aesthetic!</option>
    <option value="pastel">Pastel</option>
    <option value="gothic">Gothic</option>
    <option value="minimalist">Minimalist</option>
    <option value="dark-academia">Dark Academia</option>
  </select>
  <br>
  <button onclick="applyAesthetic()">Submit</button>
  <button onclick="resetTheme()">Reset</button>

  <p id="feedback"></p>

  <div class="audio-toggle" onclick="toggleAudio()">🔈 Mute</div>

  <!-- Audio Files -->
  <audio id="aestheticAudio" preload="auto">
    <source id="audioSource" src="" type="audio/mp3">
    Your browser does not support the audio element.
  </audio>

  <script>
    const audioTracks = {
      "pastel": "https://cdn.pixabay.com/download/audio/2022/03/15/audio_9b4244f35b.mp3",
      "gothic": "https://cdn.pixabay.com/download/audio/2022/01/19/audio_3f487f76a4.mp3",
      "minimalist": "https://cdn.pixabay.com/download/audio/2022/03/15/audio_bf9245f33f.mp3",
      "dark-academia": "https://cdn.pixabay.com/download/audio/2023/06/28/audio_3bce265fe2.mp3"
    };

    let isMuted = false;

    function applyAesthetic() {
      const aesthetic = document.getElementById("aestheticSelect").value;
      const message = document.getElementById("message");
      const feedback = document.getElementById("feedback");
      const audio = document.getElementById("aestheticAudio");
      const source = document.getElementById("audioSource");

      if (!aesthetic) {
        feedback.textContent = "Please choose an aesthetic!";
        return;
      }

      // Fade out
      document.body.classList.remove("fade-in");
      document.body.classList.add("fade-out");

      setTimeout(() => {
        document.body.className = '';
        document.body.classList.add("aesthetic", aesthetic, "fade-in");

        const title = aesthetic.replace("-", " ");
        message.textContent = `Hello ${toTitleCase(title)} World!`;

        if (aesthetic === "gothic") {
          document.body.style.color = "#e0e0e0";
        } else if (aesthetic === "minimalist") {
          document.body.style.color = "#111";
        } else if (aesthetic === "dark-academia") {
          document.body.style.color = "#2b1e15";
        } else {
          document.body.style.color = "#333";
        }

        feedback.textContent = `You've entered ${toTitleCase(title)} mode ✨`;

        // Load and play audio
        if (audioTracks[aesthetic]) {
          source.src = audioTracks[aesthetic];
          audio.load();
          if (!isMuted) {
            audio.play().catch(() => {});
          }
        }
      }, 500);
    }

    function resetTheme() {
      document.body.className = '';
      document.body.style.background = "white";
      document.body.style.color = "black";
      document.getElementById("message").textContent = "Hello World! 🌍";
      document.getElementById("feedback").textContent = "";
      document.getElementById("aestheticSelect").selectedIndex = 0;
      document.getElementById("aestheticAudio").pause();
    }

    function toggleAudio() {
      const audio = document.getElementById("aestheticAudio");
      isMuted = !isMuted;
      if (isMuted) {
        audio.pause();
        document.querySelector(".audio-toggle").textContent = "🔇 Unmute";
      } else {
        audio.play().catch(() => {});
        document.querySelector(".audio-toggle").textContent = "🔈 Mute";
      }
    }

    function toTitleCase(str) {
      return str.split(" ").map(word => word[0].toUpperCase() + word.slice(1)).join(" ");
    }
  </script>
</body>
</html>
