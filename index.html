<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hello World Plus One</title>
</head>
<body>
  <h1 id="message">Hello World!</h1> <!-- added ! -->

  <input id="userInput" type="text" placeholder="Type something..." />
  <button onclick="updateMessage()">Submit</button>

  <script>
    function updateMessage() {
      const input = document.getElementById("userInput").value;
      document.getElementById("message").textContent = "You said: " + input;
    }
  </script>
</body>
</html>
