<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hello World Plus One</title>
  <style>
    body {
      text-align: center;
      font-family: sans-serif;
      padding-top: 100px;
      transition: background 1s ease, color 1s ease;
      position: relative;
      z-index: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body.rainbow::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(270deg, red, orange, yellow, green, blue, indigo, violet);
      background-size: 400% 400%;
      animation: shimmer 10s ease infinite;
      z-index: -1;
    }

    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    select, button {
      padding: 10px;
      font-size: 16px;
      margin: 10px;
      border-radius: 8px;
      border: none;
    }

    #feedback {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1 id="message">Hello World! 🌍</h1>

  <select id="colorSelect">
    <option value="" disabled selected>Pick your color!</option>
    <option value="blue">Blue</option>
    <option value="pink">Pink</option>
    <option value="green">Green</option>
    <option value="purple">Purple</option>
    <option value="yellow">Yellow</option>
    <option value="orange">Orange</option>
    <option value="red">Red</option>
    <option value="rainbow">Rainbow 🌈</option>
  </select>
  <br>
  <button onclick="changeTheme()">Submit</button>
  <button onclick="resetTheme()">Reset</button>

  <p id="feedback"></p>

  <script>
    function changeTheme() {
      const select = document.getElementById("colorSelect");
      const color = select.value;
      const feedback = document.getElementById("feedback");

      if (!color) {
        feedback.textContent = "Please choose a color from the dropdown!";
        return;
      }

      const colorMap = {
        blue: ["#d0e8ff", "#003366"],
        pink: ["#ffe0ef", "#a0005b"],
        green: ["#dafbe1", "#174e26"],
        purple: ["#f0e6ff", "#4b0082"],
        yellow: ["#fff9d6", "#8a7200"],
        orange: ["#ffe8cc", "#b34700"],
        red: ["#ffd6d6", "#8b0000"]
      };

      if (color === "rainbow") {
        document.body.classList.add("rainbow");
        document.body.style.background = "none";
        document.body.style.color = "#111";
        feedback.textContent = "🌈 Rainbow mode activated! Taste the colors.";
        return;
      }

      const [bg, text] = colorMap[color];
      document.body.classList.remove("rainbow");
      document.body.style.background = bg;
      document.body.style.color = text;
      feedback.textContent = `Nice! The page is now themed with ${color}.`;
    }

    function resetTheme() {
      document.body.classList.remove("rainbow");
      document.body.style.background = "white";
      document.body.style.color = "black";
      document.getElementById("feedback").textContent = "";
      document.getElementById("colorSelect").selectedIndex = 0;
    }
  </script>
</body>
</html>
